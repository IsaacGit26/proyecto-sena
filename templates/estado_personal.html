<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estado personal</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baskervville:ital,wght@0,400..700;1,400..700&family=Inknut+Antiqua:wght@300;400;500;600;700;800;900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style1.css') }}">
</head>
<body>
    <footer>
        <nav>
            <a href="{{url_for('panel_principal')}}">Pantalla principal</a>
            <a href="{{url_for('personal')}}">Personal</a>
            <a href="{{url_for('estado_personal')}}">Estado personal</a>
            <a href="{{url_for('veredas')}}">Veredas</a>
            <a href="{{url_for('familias')}}">Familias</a>
        </nav>
    </footer>
    <section>
        <h2>Estado del personal</h2>
        <table border="1">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Documento</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for persona in personas %}
                <tr>
                    <td> {{persona.idPersonas}} </td>
                    <td> {{persona.nombre}} </td>
                    <td> {{persona.documento}} </td>
                    <td> {{persona.estado}} </td>
                    <td>
                        <a href="{{url_for('editar_estado', id=persona.idPersonas)}}">Cambiar estado</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </section>
</body>
</html>
