<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baskervville:ital,wght@0,400..700;1,400..700&family=Inknut+Antiqua:wght@300;400;500;600;700;800;900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <section>
        <form action="/login" method="post">
            <h1>Inicia sesión</h1>
            <label>Correo electrónico</label>
            <br>
            <input type="email" name="correoElectronico" placeholder="nombre" required> <img src="static/image/correo.png" height="20px">
            <br>
            <label>Contraseña</label>
            <br>
            <input type="password" name="password" placeholder="contraseña" required> <img src="static/image/contraseña.png" height="20px">
            <br>
            <button type="submit">Ingresar</button>
            <p>Aun no estas registrado <a href="{{ url_for('inicio') }}">Registrate</a> </p>
        </form>
    </section>
</body>
</html>
