    <section>
        <form action="/registro_personal" method="post">
            <label>nombre</label>
            <br>
            <input type="text" name="nombre">
            <br>
            <label>Tipo de documento</label>
            <br>
            <select name="tipoDocumento">
                <option value="RC">Registro civil</option>
                <option value="TI">Tarjeta de indentidad</option>
                <option value="CD">Cedula</option>
            </select>
            <br>
            <label>Numero de documento</label>
            <br>
            <input type="number" name="documento">
            <br>
            <label>Genero</label>
            <br>
            <select name="genero">
                <option value="masculino">Masculino</option>
                <option value="femenino">Femenino</option>
            </select>
            <br>
            <label>Fecha de nacimiento</label>
            <br>
            <input type="date" name="fechaNacimiento">
            <br>
            <label>Edad</label>
            <br>
            <input type="number" name="edad">
            <br>
            <label>Teléfono</label>
            <br>
            <input type="number" name="telefono">
            <br>
            <label>Dirección</label>
            <br>
            <input type="text" name="direccion">
            <br>
            <label>Estado civil</label>
            <br>
            <input type="text" name="estadoCivil">
            <br>
            <label>Bautizado</label>
            <br>
            <input type="text" name="bautizado">
            <br>
            <label>Fecha del bautismo</label>
            <br>
            <input type="date" name="fechaBautismo">
            <br>
            <button type="submit">Guardar</button>
        </form>
    </section>
